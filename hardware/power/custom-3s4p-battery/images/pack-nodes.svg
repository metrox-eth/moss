<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="920" viewBox="0 0 1500 920" role="img" aria-labelledby="title desc"><title id="title">MOSS 3S4P pack: both faces and four electrical nodes</title><desc id="desc">Two rows of six cells. Face 1 has node 0 on the left four negative ends and node 2 joining the right eight ends. Face 2 has node 1 joining the left eight ends and node 3 on the right four positive ends. These are opposite ends of the same twelve cells, with group 1 kept left.</desc>
